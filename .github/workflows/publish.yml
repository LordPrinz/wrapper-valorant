name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm publish --provenance --access public

  github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@lordprinz"
          cache: npm
      - run: npm ci
      - run: npm run build
      # GitHub Packages requires a scoped name owned by the repo owner.
      - name: Scope package name for GitHub Packages
        run: npm pkg set name=@lordprinz/wrapper-valorant-api
      # dist is already built above and validated by the npm job's `check`;
      # skip lifecycle scripts so prepublishOnly's pack-smoke (which imports the
      # unscoped name) doesn't run against the temporarily scoped package name.
      - run: npm publish --registry=https://npm.pkg.github.com --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
